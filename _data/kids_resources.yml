# Wiki entries for /kids. Each resource: a headline+link, a description,
# a few hand-picked projects, and a prominent "other projects" link.
# Add new resources by appending another entry — kids/index.md renders this list.

- name: Raspberry Pi Foundation
  url: https://projects.raspberrypi.org/en/projects
  tagline: Learn to code — Scratch, Python, and physical computing
  description: >
    Free, step-by-step coding and making projects from the nonprofit behind the
    Raspberry Pi computer. Every project is written out in clear steps — build a
    game, a Python program, or a working gadget with real hardware.
  projects:
    - title: Rock, Paper, Scissors
      url: https://projects.raspberrypi.org/en/projects/rock-paper-scissors
      description: Build a two-player game in Scratch.
    - title: Space Talk
      url: https://projects.raspberrypi.org/en/projects/space-talk
      description: Write an interactive text-based space adventure in Python.
    - title: Boat Race
      url: https://projects.raspberrypi.org/en/projects/boat-race
      description: Code a fast-paced two-player racing game.
    - title: Rock Band
      url: https://projects.raspberrypi.org/en/projects/rock-band
      description: Turn Scratch into a playable instrument.
  other:
    label: Browse every project
    url: https://projects.raspberrypi.org/en/projects

- name: Code.org
  url: https://code.org/
  tagline: Programming courses kids can work through on their own
  description: >
    Self-paced coding courses that mix short reading with real building —
    block-based at first, then real JavaScript. No lecture videos required to
    make progress.
  projects:
    - title: App Lab
      url: https://studio.code.org/s/applab-intro/reset
      description: Design and code a working app, block-based or in JavaScript.
    - title: CS Fundamentals Express
      url: https://code.org/educate/curriculum/csf-express
      description: A fast-paced intro course covering the basics of programming.
    - title: "Minecraft: Hour of Code"
      url: https://code.org/mc
      description: Solve puzzles by writing code inside a Minecraft world.
  other:
    label: See the full course catalog
    url: https://studio.code.org/catalog

- name: NASA Space Place
  url: https://spaceplace.nasa.gov/
  tagline: Space and Earth science, explained for kids — plus real activities
  description: >
    NASA's official kids' site. Short, clear articles on space and Earth science,
    paired with hands-on crafts, printable activities, and simple browser activities.
  projects:
    - title: CubeSat Builder
      url: https://spaceplace.nasa.gov/cubesat-builder-game/en/
      description: Design and build a virtual NASA spacecraft.
    - title: Your Name in Landsat
      url: https://spaceplace.nasa.gov/your-name-in-landsat/en/
      description: Spell your name using real satellite imagery of Earth.
    - title: Loopy Legends
      url: https://spaceplace.nasa.gov/loopy-legends/en/
      description: Write your own space adventure story.
  other:
    label: See all activities
    url: https://spaceplace.nasa.gov/menu/activities/

- name: Exploratorium Science Snacks
  url: https://www.exploratorium.edu/snacks
  tagline: Real science experiments, explained step by step
  description: >
    Hundreds of hands-on science experiments from San Francisco's Exploratorium
    museum, each with a materials list, clear instructions, and the science behind
    why it works.
  projects:
    - title: Condiment Diver
      url: https://www.exploratorium.edu/snacks/condiment-diver
      description: Build a diver that sinks and rises inside a bottle — explore pressure and density.
    - title: Colored Shadows
      url: https://www.exploratorium.edu/snacks/colored-shadows
      description: Cast rainbow shadows and see how our eyes mix color.
    - title: Make Your Own Rainstick
      url: https://www.exploratorium.edu/snacks/make-your-own-rainstick
      description: Build an instrument that mimics the sound of rain.
  other:
    label: Browse all Science Snacks
    url: https://www.exploratorium.edu/snacks

- name: Tinkercad
  url: https://www.tinkercad.com/
  tagline: Design in 3D, wire circuits, and learn to code — free in the browser
  description: >
    Autodesk's free browser tool for 3D design, electronics, and block-based
    coding. Written lessons walk you through each skill, then you build your own
    thing and can share it.
  projects:
    - title: 3D Design lessons
      url: https://www.tinkercad.com/learn/3d-design
      description: Learn to model and 3D print your own designs.
    - title: Circuits lessons
      url: https://www.tinkercad.com/learn/circuits
      description: Wire and simulate real electronics, from LEDs to Arduino.
    - title: Codeblocks lessons
      url: https://www.tinkercad.com/learn/codeblocks
      description: Use block-based code to build 3D shapes.
  other:
    label: Browse community designs
    url: https://www.tinkercad.com/things

- name: Rebrickable
  url: https://rebrickable.com/
  tagline: Free LEGO building instructions for thousands of fan-made creations
  description: >
    A huge, free library of building instructions for custom LEGO models ("MOCs")
    designed by fans — way beyond what comes in the box. Read the instructions,
    find the pieces, and build.
  projects:
    - title: Most Popular MOCs
      url: https://rebrickable.com/mocs/popular/
      description: The community's highest-rated custom builds.
    - title: Free Building Instructions
      url: https://rebrickable.com/instructions/
      description: Official LEGO set instructions, searchable by set number.
  other:
    label: Browse all MOCs
    url: https://rebrickable.com/mocs/
